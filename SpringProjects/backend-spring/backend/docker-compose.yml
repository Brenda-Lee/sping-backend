services:
  postgres:
    image: postgres:16-alpine
    container_name: attus-users-postgres
    environment:
      POSTGRES_DB: attus_users
      POSTGRES_USER: attus
      POSTGRES_PASSWORD: attus
    ports:
      - "5432:5432"
    volumes:
      - attus_users_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attus -d attus_users"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  attus_users_data:
